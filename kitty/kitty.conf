# ─── KONFIGURASI FONT ───
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ─── WINDOW & TRANSPARANSI ───
# Memberikan efek transparan (glassmorphism)
background_opacity 1
# background_opacity 0.85

# Memberikan ruang (padding) di dalam terminal agar teks tidak menempel ke border
window_padding_width 12

# Menyembunyikan dekorasi jendela bawaan (karena diatur oleh Hyprland)
hide_window_decorations yes
confirm_os_window_close 0

# ─── PENGATURAN KURSOR ───
cursor           #ff79c6
cursor_text_color #282a36
cursor_shape     block
shell_integration obedience

# ─── SKEMA WARNA (DRACULA PURPLE) ───
foreground       #f8f8f2
background       #1e1e2e
selection_foreground #ffffff
selection_background #44475a

# Black
color0 #21222c
color8 #6272a4

# Red
color1 #ff5555
color9 #ff6e6e

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue
color4  #bd93f9
color12 #d6acff

# Magenta (Ungu Utama)
